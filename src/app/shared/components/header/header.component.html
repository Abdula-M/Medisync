<header class="dashboard-header">
  <div class="header-content">
    <a [routerLink]="dashboardUrl()" class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span>{{ isDoctor() ? 'MediSync Doctor' : 'Medisync' }}</span>
    </a>
    
    @if (!isDoctor()) {
      <nav class="nav-links">
        <a [routerLink]="dashboardUrl()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Мои записи
        </a>
      </nav>
    }
    
    <div class="user-actions" [style.margin-left]="isDoctor() ? 'auto' : '0'">
      @if (user()) {
        <span class="user-name">{{ user()?.username }}</span>
      }
      <button class="logout-btn" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Выйти
      </button>
    </div>
  </div>
</header>

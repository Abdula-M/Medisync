<div class="files-card no-print">
  <div class="card-header">
    <h3>Прикрепленные файлы</h3>
  </div>

  <div class="file-list">
    @for (file of files(); track file.id) {
    <a href="#" (click)="openFile(file, $event)" class="file-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="file-icon">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
        <polyline points="13 2 13 9 20 9"></polyline>
      </svg>
      <span class="file-name">{{ file.name }}</span>
    </a>
    } @empty {
    <p class="empty-text">Нет прикрепленных файлов.</p>
    }
  </div>

  @if (isPatient() && !isCancelled()) {
  <div class="upload-section">
    <label for="fileUpload" class="btn-secondary upload-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      Загрузить файл
    </label>
    <input type="file" id="fileUpload" class="hidden-input" (change)="onFileSelected($event)"
      accept="image/*,application/pdf" />

    @if (fileWarning()) {
    <div class="file-warning">
      {{ fileWarning() }}
    </div>
    }
  </div>
  }
</div>
